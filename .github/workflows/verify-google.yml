name: Verify Google Ads access

# Checks the Google Ads API credentials work (no real conversion needed).
# Runs daily as a health check: the OAuth refresh token silently expires if the
# consent screen is in "Testing" mode, which breaks BOTH the webhook and the cron.
# A failed scheduled run notifies the repo (GitHub emails watchers) so it's caught early.
on:
  # PAUSED: the OAuth refresh token returns invalid_grant, so every scheduled run
  # fails and mails the repo. Re-enable after minting a new refresh token with the
  # datamanager scope (and publishing the OAuth consent screen so it stops expiring).
  # schedule:
  # - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Google Ads credentials
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_CONVERSION_ACTION_ID: ${{ secrets.GOOGLE_ADS_CONVERSION_ACTION_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: node scripts/verify-google.mjs
